<html>
  <head>
    <meta charset="utf-8" />
    <title>Animated Watch</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <svg width="200" height="200" viewBox="-100 -100 200 200">
      <circle class="back-plate" cx="0" cy="0" r="90" />
      <circle class="minute-marker" cx="0" cy="0" r="90" pathLength="60" />
      <circle class="hour-marker" cx="0" cy="0" r="90" pathLength="60" />
      <g id="hour-hand">
        <line class="hand" x1="0" y1="0" x2="0" y2="-50" />
        <line class="hand hand--thick" x1="0" y1="-12" x2="0" y2="-50" />
      </g>
      <g id="minute-hand">
        <line class="hand" x1="0" y1="0" x2="0" y2="-80" />
        <line class="hand hand--thick" x1="0" y1="-12" x2="0" y2="-80" />
      </g>
    </svg>
  </body>
  <script src="./script.js"></script>
</html>
